# Model registry for the AMD Strix Halo box (Windows). Same model names and ports as
# models.toml so every `local-llm eval …` command is identical on both machines; only the
# serving knobs differ. Selected automatically on Windows (or LOCAL_LLM_MODELS_TOML).
#
# Strix Halo notes (Sept 2026; see README "Windows / AMD Strix Halo"):
# - Variable Graphics Memory: Adrenalin > Performance > Tuning. Set it high (>= 96 GB) before
#   serving gpt-oss-120b (~63 GB weights + KV). The setting cannot be read programmatically.
# - --no-mmap: mmap'd weights cause a severe slowdown on this APU with both backends.
# - ubatch_size = 512: -ub 2048 is implicated in Vulkan DeviceLost crashes at 65-80K context
#   (llama.cpp #20515). Batch stays 2048 for prefill throughput.
# - n_gpu_layers = 999: unified memory, everything on the iGPU. The Spark's "70" for 120b is a
#   GB10 tuning value and does not apply here.
# - Host RAM can grow across many cached prompts (llama.cpp #22372). If `unified_mem` in perf runs
#   climbs monotonically, add "--kv-unified" (and "--swa-full") to extra_args.
# - Expect cold prefill of a 100K-token filing to take minutes, not seconds; eval request timeout
#   is 3600 s on this platform (LOCAL_LLM_EVAL_TIMEOUT_S).

[defaults]
n_gpu_layers = 999
flash_attn = "on"
batch_size = 2048
ubatch_size = 512
host = "127.0.0.1"

[models.gpt-oss-20b]
repo = "ggml-org/gpt-oss-20b-GGUF"
file = "gpt-oss-20b-MXFP4.gguf"
kind = "chat"
ctx_size = 131072
port = 8080
extra_args = ["--jinja", "--no-mmap"]

[models.qwen3-8b]
repo = "unsloth/Qwen3-8B-GGUF"
quant = "Q4_K_M"
kind = "chat"
ctx_size = 32768
port = 8081
extra_args = ["--jinja", "--no-mmap"]
sampling = { temp = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0 }

[models.qwen3-embedding-4b]
repo = "Qwen/Qwen3-Embedding-4B-GGUF"
file = "Qwen3-Embedding-4B-Q4_K_M.gguf"
kind = "embedding"
port = 8090
extra_args = ["--embeddings", "--no-mmap"]

[models.gpt-oss-120b]
repo = "ggml-org/gpt-oss-120b-GGUF"
file = "gpt-oss-120b-MXFP4.gguf"
kind = "chat"
ctx_size = 131072
port = 8082
extra_args = ["--jinja", "--no-mmap"]

[models.nemotron-3-super]
# Same model/port as models.toml; see the notes there. KV cache is tiny (8 KiB/token f16), so
# 524288 context costs ~4 GiB on top of the 69.9 GB weights: fits in a 96 GB VGM allocation.
# Native llama-server path only (LM Studio has its own model catalogue).
repo = "ggml-org/nemotron-3-super-120b-GGUF"
file = "Nemotron-3-Super-120B-Q4_K.gguf"
kind = "chat"
ctx_size = 524288
n_parallel = 1
port = 8085
extra_args = ["--jinja", "--no-mmap"]
sampling = { temp = 0.6, top_p = 0.95 }
