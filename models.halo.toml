# Model registry for the AMD Strix Halo box (Windows). Same model names and ports as
# models.toml so every `local-llm eval …` command is identical on both machines; only the
# serving knobs differ. Selected automatically on Windows (or LOCAL_LLM_MODELS_TOML).
#
# Strix Halo notes (Sept 2026; see README "Windows / AMD Strix Halo"):
# - Variable Graphics Memory: Adrenalin > Performance > Tuning. Set it high (>= 96 GB) before
#   serving gpt-oss-120b (~63 GB weights + KV). The setting cannot be read programmatically.
# - --no-mmap: mmap'd weights cause a severe slowdown on this APU with both backends.
# - ubatch_size = 512: -ub 2048 is implicated in Vulkan DeviceLost crashes at 65-80K context
#   (llama.cpp #20515). Batch stays 2048 for prefill throughput.
# - n_gpu_layers = 999: unified memory, everything on the iGPU. The Spark's "70" for 120b is a
#   GB10 tuning value and does not apply here.
# - Host RAM can grow across many cached prompts (llama.cpp #22372). If `unified_mem` in perf runs
#   climbs monotonically, add "--kv-unified" (and "--swa-full") to extra_args.
# - Expect cold prefill of a 100K-token filing to take minutes, not seconds; eval request timeout
#   is 3600 s on this platform (LOCAL_LLM_EVAL_TIMEOUT_S).

[defaults]
n_gpu_layers = 999
flash_attn = "on"
batch_size = 2048
ubatch_size = 512
host = "127.0.0.1"

[models.gpt-oss-20b]
repo = "ggml-org/gpt-oss-20b-GGUF"
file = "gpt-oss-20b-MXFP4.gguf"
kind = "chat"
ctx_size = 131072
port = 8080
extra_args = ["--jinja", "--no-mmap"]

[models.qwen3-8b]
repo = "unsloth/Qwen3-8B-GGUF"
quant = "Q4_K_M"
kind = "chat"
ctx_size = 32768
port = 8081
extra_args = ["--jinja", "--no-mmap"]
sampling = { temp = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0 }

[models.qwen3-embedding-4b]
repo = "Qwen/Qwen3-Embedding-4B-GGUF"
file = "Qwen3-Embedding-4B-Q4_K_M.gguf"
kind = "embedding"
port = 8090
extra_args = ["--embeddings", "--no-mmap"]

[models.gpt-oss-120b]
repo = "ggml-org/gpt-oss-120b-GGUF"
file = "gpt-oss-120b-MXFP4.gguf"
kind = "chat"
ctx_size = 131072
port = 8082
extra_args = ["--jinja", "--no-mmap"]

[models.nemotron-3-super]
# Same model/port as models.toml; see the notes there. KV cache is tiny (8 KiB/token f16), so
# 524288 context costs ~4 GiB on top of the 69.9 GB weights: fits in a 96 GB VGM allocation.
# Native llama-server path only (LM Studio has its own model catalogue).
repo = "ggml-org/nemotron-3-super-120b-GGUF"
file = "Nemotron-3-Super-120B-Q4_K.gguf"
kind = "chat"
ctx_size = 524288
n_parallel = 1
port = 8085
extra_args = ["--jinja", "--no-mmap"]
sampling = { temp = 0.6, top_p = 0.95 }

[models."qwen3.8-27b"]
# Dense 27B VL (arch qwen35), native 262K ctx. Added for the RTX 5090 CUDA run; same name, quant,
# port and flags as the Spark entry in models.toml. ubatch 2048: the Halo default of 512 is an AMD
# Vulkan workaround that does not apply to CUDA. No --no-mmap.
repo = "unsloth/Qwen3.8-27B-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8084
ubatch_size = 2048
extra_args = ["--jinja"]

[models."qwen3.8-27b-code"]
# Same weights as qwen3.8-27b with reasoning off (--reasoning off). Used for the tier-1
# "reasoning off" row in docs/eval-report-2026-09-rtx5090-financebench-swe-qwen.md and for editor
# use, where the first token should arrive immediately. Same port, so only one of the two runs at
# a time.
repo = "unsloth/Qwen3.8-27B-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8084
ubatch_size = 2048
extra_args = ["--jinja", "--reasoning", "off"]

[models."glm-4.7-flash"]
# Z.ai GLM-4.7-Flash, MoE 30B / ~3.6B active, 17.5 GB at UD-Q4_K_XL. Same name, quant, port and
# ctx as models.toml; Halo knobs (--no-mmap, ubatch 512 from defaults) apply. Fits the 32 GB
# RTX 5090 with room for the 131K KV cache.
repo = "unsloth/GLM-4.7-Flash-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8086
extra_args = ["--jinja", "--no-mmap"]
sampling = { temp = 1.0, top_p = 0.95 }

[models."glm-4.7-flash-nothink"]
# Same weights, thinking disabled server-side (--reasoning off). Same port as glm-4.7-flash.
repo = "unsloth/GLM-4.7-Flash-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8086
extra_args = ["--jinja", "--no-mmap", "--reasoning", "off"]
sampling = { temp = 1.0, top_p = 0.95 }

[models."qwen3.5-122b-a10b"]
# Qwen3.5-122B-A10B MoE, ~70 GB at UD-Q4_K_XL + ~6 GiB KV at 262K. Fits under the 96 GB Windows
# graphics-memory cap on the Halo only just; does NOT fit the 32 GB RTX 5090. Same name, quant,
# port and ctx as models.toml; Halo knobs (--no-mmap, ubatch 512 from defaults) apply.
repo = "unsloth/Qwen3.5-122B-A10B-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 262144
n_parallel = 1
port = 8087
extra_args = ["--jinja", "--no-mmap"]
sampling = { temp = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0 }

[models."qwen3.5-122b-a10b-nothink"]
# Same weights, thinking disabled server-side (--reasoning off). Same port.
repo = "unsloth/Qwen3.5-122B-A10B-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 262144
n_parallel = 1
port = 8087
extra_args = ["--jinja", "--no-mmap", "--reasoning", "off"]
sampling = { temp = 0.7, top_p = 0.8, top_k = 20, min_p = 0.0 }

[models."bonsai-2-27b"]
# PrismML Ternary Bonsai 2 27B: Qwen3.8-27B re-expressed in ternary (-1, 0, +1) weights with FP16
# group scales, 1.72 bits/weight, 7.21 GB as PQ2_0 (2-bit slots; PrismML's faster pack on Blackwell
# and for prompt processing) vs 17.6 GB for the UD-Q4_K_XL base. Same 262K hybrid-attention backbone,
# thinks by default (reasoning effort "xhigh" unless told otherwise). Apache-2.0.
# NEEDS PrismML's llama.cpp fork (github.com/PrismML-Eng/llama.cpp releases): stock llama.cpp rejects
# the PQ2_0/PTQ1_0 tensor types. Point LOCAL_LLM_LLAMA_BIN_DIR at the fork's binaries for this model.
# Default ctx 131072 = the budget every other local model was scored under.
repo = "prism-ml/Ternary-Bonsai-2-27B-gguf"
file = "Ternary-Bonsai-2-27B-PQ2_0.gguf"
kind = "chat"
ctx_size = 131072
port = 8088
ubatch_size = 2048     # CUDA box; the 512 Halo default is an AMD Vulkan workaround
extra_args = ["--jinja"]

[models."bonsai-2-27b-nothink"]
# Same weights, thinking disabled server-side (--reasoning off). Same port.
repo = "prism-ml/Ternary-Bonsai-2-27B-gguf"
file = "Ternary-Bonsai-2-27B-PQ2_0.gguf"
kind = "chat"
ctx_size = 131072
port = 8088
ubatch_size = 2048     # CUDA box; the 512 Halo default is an AMD Vulkan workaround
extra_args = ["--jinja", "--reasoning", "off"]

[models."gemma-4-31b"]
# Google Gemma 4 31B-it, dense 30.7B, Google's QAT q4_0 GGUF (17.65 GB). Same name, file, port and
# ctx as models.toml; Halo knobs (--no-mmap, ubatch 512 from defaults) apply. Fits the 32 GB RTX
# 5090 with room for the 131K KV cache (SWA layers keep only a 1024-token window).
repo = "google/gemma-4-31B-it-qat-q4_0-gguf"
file = "gemma-4-31B_q4_0-it.gguf"
kind = "chat"
ctx_size = 131072
port = 8089
extra_args = ["--jinja", "--no-mmap"]
sampling = { temp = 1.0, top_p = 0.95, top_k = 64 }

[models."gemma-4-31b-nothink"]
# Same weights, thinking disabled server-side (--reasoning off). Same port.
repo = "google/gemma-4-31B-it-qat-q4_0-gguf"
file = "gemma-4-31B_q4_0-it.gguf"
kind = "chat"
ctx_size = 131072
port = 8089
extra_args = ["--jinja", "--no-mmap", "--reasoning", "off"]
sampling = { temp = 1.0, top_p = 0.95, top_k = 64 }

[models."gemma-4-26b-a4b"]
# Gemma 4 26B-A4B-it, MoE 25.2B / 3.8B active, Google QAT q4_0 (14.44 GB). Same name, file, port
# and ctx as models.toml; Halo knobs apply. Fits the RTX 5090.
repo = "google/gemma-4-26B-A4B-it-qat-q4_0-gguf"
file = "gemma-4-26B_q4_0-it.gguf"
kind = "chat"
ctx_size = 131072
port = 8091
extra_args = ["--jinja", "--no-mmap"]
sampling = { temp = 1.0, top_p = 0.95, top_k = 64 }

[models."gemma-4-26b-a4b-nothink"]
# Same weights, thinking disabled server-side (--reasoning off). Same port.
repo = "google/gemma-4-26B-A4B-it-qat-q4_0-gguf"
file = "gemma-4-26B_q4_0-it.gguf"
kind = "chat"
ctx_size = 131072
port = 8091
extra_args = ["--jinja", "--no-mmap", "--reasoning", "off"]
sampling = { temp = 1.0, top_p = 0.95, top_k = 64 }

# deepseek-v4-flash (models.toml, port 8092) is Spark-only: its 96.8 GB of UD-Q2_K_XL weights alone
# exceed the 96 GB Windows graphics-memory cap on the Halo and the 32 GB RTX 5090. Port 8092 is
# reserved so the names stay aligned if a Linux-on-Halo path ever serves it.

[models."laguna-s-2.1"]
# Poolside Laguna S 2.1, UD-Q4_K_XL (~40 GB): unlike deepseek-v4-flash, this fits the Halo's 96 GB
# VGM cap, so it is registered on both platforms. See models.toml for the full identity comment.
repo = "unsloth/Laguna-S-2.1-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8093
extra_args = ["--jinja", "--no-mmap"]

[models."laguna-s-2.1-thinking"]
# Same weights, thinking enabled server-side. Same port.
repo = "unsloth/Laguna-S-2.1-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8093
extra_args = ["--jinja", "--no-mmap", "--chat-template-kwargs", "{\"enable_thinking\": true}"]
