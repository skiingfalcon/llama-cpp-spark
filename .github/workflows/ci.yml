name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      # Committed artifacts must stay loadable and canonical: this is the check that would
      # have caught the report crash on the first Halo runs.
      - run: uv run python scripts/migrate_runs.py --check
      - name: report smoke over committed runs
        run: |
          uv run local-llm eval report --suite sec > /dev/null
          git diff --exit-code -- state/evals/report-sec.md || {
            echo "state/evals/report-sec.md is stale; run: uv run local-llm eval report --suite sec"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/lmstudio.mjs
      - run: node scripts/lmstudio.mjs report
