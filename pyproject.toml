[project]
name = "spark-llm"
version = "0.1.0"
description = "Native llama.cpp CUDA inference for NVIDIA DGX Spark (GB10 / sm_121)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.16.0",
    "huggingface-hub>=0.30.0",
    "openai>=1.70.0",
    "httpx>=0.28.0",
    "rich>=14.0.0",
    "pydantic-settings>=2.8.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0.3",
    "tiktoken>=0.11.0",
]

[project.scripts]
spark-llm = "spark_llm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer Argument/Option defaults are the documented pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
