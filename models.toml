# Model registry for the NVIDIA DGX Spark (Linux, CUDA). The AMD Strix Halo box uses
# models.halo.toml (same model names and ports, different serving knobs).

[defaults]
n_gpu_layers = 999
flash_attn = "on"
batch_size = 2048
ubatch_size = 2048
host = "0.0.0.0"

[models.gpt-oss-20b]
repo = "ggml-org/gpt-oss-20b-GGUF"
file = "gpt-oss-20b-MXFP4.gguf"
kind = "chat"
ctx_size = 0
port = 8080
extra_args = ["--jinja"]

[models.qwen3-8b]
repo = "unsloth/Qwen3-8B-GGUF"
quant = "Q4_K_M"
kind = "chat"
ctx_size = 32768
port = 8081
extra_args = ["--jinja"]
sampling = { temp = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0 }

[models.qwen3-embedding-4b]
repo = "Qwen/Qwen3-Embedding-4B-GGUF"
file = "Qwen3-Embedding-4B-Q4_K_M.gguf"
kind = "embedding"
port = 8090
extra_args = ["--embeddings"]

[models.gpt-oss-120b]
repo = "ggml-org/gpt-oss-120b-GGUF"
file = "gpt-oss-120b-MXFP4.gguf"
kind = "chat"
ctx_size = 131072
n_gpu_layers = 70
port = 8082
extra_args = ["--jinja"]

[models.mistral-7b-instruct]
# Local file only (no repo): place it in models_dir yourself.
file = "mistral-7b-instruct.Q4_K_M.gguf"
kind = "chat"
ctx_size = 8192
port = 8083
extra_args = ["--jinja"]
