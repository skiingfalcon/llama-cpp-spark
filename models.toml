# Model registry for the NVIDIA DGX Spark (Linux, CUDA). The AMD Strix Halo box uses
# models.halo.toml (same model names and ports, different serving knobs).

[defaults]
n_gpu_layers = 999
flash_attn = "on"
batch_size = 2048
ubatch_size = 2048
host = "0.0.0.0"

[models.gpt-oss-20b]
repo = "ggml-org/gpt-oss-20b-GGUF"
file = "gpt-oss-20b-MXFP4.gguf"
kind = "chat"
ctx_size = 0
port = 8080
extra_args = ["--jinja"]

[models.qwen3-8b]
repo = "unsloth/Qwen3-8B-GGUF"
quant = "Q4_K_M"
kind = "chat"
ctx_size = 32768
port = 8081
extra_args = ["--jinja"]
sampling = { temp = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0 }

[models.qwen3-embedding-4b]
repo = "Qwen/Qwen3-Embedding-4B-GGUF"
file = "Qwen3-Embedding-4B-Q4_K_M.gguf"
kind = "embedding"
port = 8090
extra_args = ["--embeddings"]

[models.gpt-oss-120b]
repo = "ggml-org/gpt-oss-120b-GGUF"
file = "gpt-oss-120b-MXFP4.gguf"
kind = "chat"
ctx_size = 131072
n_gpu_layers = 70
port = 8082
extra_args = ["--jinja"]

[models."qwen3.8-27b"]
# Dense 27B VL (arch qwen35), native 262K ctx; text backbone via -hf repo:quant.
repo = "unsloth/Qwen3.8-27B-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8084
extra_args = ["--jinja"]

[models.mistral-7b-instruct]
# Local file only (no repo): place it in models_dir yourself.
file = "mistral-7b-instruct.Q4_K_M.gguf"
kind = "chat"
ctx_size = 8192
port = 8083
extra_args = ["--jinja"]

[models.nemotron-3-super]
# NVIDIA Nemotron-3-Super-120B-A12B: hybrid Mamba-2 / latent-MoE / attention, 120B total,
# ~12.7B active, native 1M context, NoPE (no RoPE scaling needed). Use the ggml-org GGUF;
# Ollama's blobs pack expert tensors differently and fail to load in upstream llama.cpp.
# Needs llama.cpp >= March 2026 (Nemotron-3 support); the pin in LLAMA_CPP_VERSION qualifies.
#
# Context budget. Only the 8 attention layers keep a KV cache (2 KV heads x 128 dims):
#   8 KiB/token at f16  ->  262144 ctx = 2 GiB, 524288 = 4 GiB, 1048576 = 8 GiB
#   (halve with cache_type_k/v = "q8_0"). Weights are 69.9 GB, so even 1M fits in 128 GB.
# Default 524288 so the largest 10-K (GS, ~242K gpt-oss tokens, more with this tokenizer)
# is read whole with no section fallback. Override per serve: `local-llm serve
# nemotron-3-super --ctx-size 1048576`, or cap the eval only: `eval sec run ... --max-input-tokens
# 131072` to score it under the same budget as gpt-oss.
# Tip: drop the page cache before the first load of a 70 GB file on the Spark
# (`sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'`) or the load can OOM.
repo = "ggml-org/nemotron-3-super-120b-GGUF"
file = "Nemotron-3-Super-120B-Q4_K.gguf"
kind = "chat"
ctx_size = 524288
n_parallel = 1          # llama-server splits --ctx-size across slots; keep the whole window on one
port = 8085
extra_args = ["--jinja"]
# NVIDIA's serving defaults (tool-calling profile). Evals pin temperature 0 / seed 42 regardless.
sampling = { temp = 0.6, top_p = 0.95 }

[models."glm-4.7-flash"]
# Z.ai GLM-4.7-Flash: MoE, 30B total / ~3.6B active (64 routed experts, 4 per token + 1 shared,
# 47 layers, MLA attention), native ctx 202752, MIT licence, thinking on by default.
# Same active size as gpt-oss-20b, so ~45 t/s decode is the expectation on GB10; the question is
# whether it reads 10-Ks better than 20b did (87.6%). Unsloth UD-Q4_K_XL is 17.5 GB.
# Default ctx 131072 = the budget every other local model was scored under; the native window
# (`serve glm-4.7-flash --ctx-size 202752`) still does not fit GS (~270K tokens) whole.
# Needs llama.cpp >= late Jan 2026 (glm4_moe_lite + the Jan 21 router-scoring fix); the pin qualifies.
repo = "unsloth/GLM-4.7-Flash-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8086
extra_args = ["--jinja"]
# Z.ai's general-use serving profile (tool-calling: temp 0.7 / top_p 1.0). Evals pin temperature 0 / seed 42.
sampling = { temp = 1.0, top_p = 0.95 }

[models."glm-4.7-flash-nothink"]
# Same weights with thinking disabled server-side (`--reasoning off` sets enable_thinking=false in
# the chat template). Same port, so only one of the two runs at a time. For the reasoning-on vs
# off comparison the RTX 5090 coding runs called for; also the editor/completion profile.
repo = "unsloth/GLM-4.7-Flash-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8086
extra_args = ["--jinja", "--reasoning", "off"]
sampling = { temp = 1.0, top_p = 0.95 }

[models."qwen3.5-122b-a10b"]
# Alibaba Qwen3.5-122B-A10B: the MoE sibling of qwen3.8-27b. 122B total / ~10B active
# (256 experts, 8 routed per token + 1 shared), 48 layers of which 12 are full attention and 36 are
# linear (gated DeltaNet) attention; native ctx 262144; VL checkpoint served text-only like the 27B.
# Why: dense Qwen read perfectly where it saw the document but decoded at 10 t/s on GB10; ~10B
# active should land near 20 t/s. This is the like-for-like comparison to gpt-oss-120b.
#
# Memory: UD-Q4_K_XL is ~70 GB (split shards; the downloader handles them). Only the 12 attention
# layers keep KV (2 KV heads x 256 dims): 24 KiB/token at f16 -> 262144 ctx = 6 GiB. Fits the Spark
# with the whole native window on one slot, but not next to gpt-oss-120b. GS (~273K Qwen tokens)
# still exceeds 262K and falls to its Item 8 section (131.6K), which scored 8/8 on the RTX 5090.
repo = "unsloth/Qwen3.5-122B-A10B-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 262144
n_parallel = 1          # keep the whole 262K window on one slot
port = 8087
extra_args = ["--jinja"]
# Qwen's thinking-mode serving profile. Evals pin temperature 0 / seed 42 regardless.
sampling = { temp = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0 }

[models."qwen3.5-122b-a10b-nothink"]
# Same weights, thinking disabled server-side (`--reasoning off` = enable_thinking=false). Same port.
repo = "unsloth/Qwen3.5-122B-A10B-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 262144
n_parallel = 1
port = 8087
extra_args = ["--jinja", "--reasoning", "off"]
# Qwen's non-thinking serving profile.
sampling = { temp = 0.7, top_p = 0.8, top_k = 20, min_p = 0.0 }

[models."bonsai-2-27b"]
# PrismML Ternary Bonsai 2 27B: Qwen3.8-27B re-expressed in ternary (-1, 0, +1) weights with FP16
# group scales, 1.72 bits/weight, 7.21 GB as PQ2_0 (2-bit slots; PrismML's faster pack on Blackwell
# and for prompt processing) vs 17.6 GB for the UD-Q4_K_XL base. Same 262K hybrid-attention backbone,
# thinks by default (reasoning effort "xhigh" unless told otherwise). Apache-2.0.
# NEEDS PrismML's llama.cpp fork (github.com/PrismML-Eng/llama.cpp releases): stock llama.cpp rejects
# the PQ2_0/PTQ1_0 tensor types. Build it with ./scripts/build-prismml.sh (pin:
# PRISMML_LLAMA_CPP_VERSION; separate from vendor/llama.cpp) and point LOCAL_LLM_LLAMA_BIN_DIR at
# its build/bin before serving this model.
# Default ctx 131072 = the budget every other local model was scored under.
repo = "prism-ml/Ternary-Bonsai-2-27B-gguf"
file = "Ternary-Bonsai-2-27B-PQ2_0.gguf"
kind = "chat"
ctx_size = 131072
port = 8088
extra_args = ["--jinja"]

[models."bonsai-2-27b-nothink"]
# Same weights, thinking disabled server-side (--reasoning off). Same port.
repo = "prism-ml/Ternary-Bonsai-2-27B-gguf"
file = "Ternary-Bonsai-2-27B-PQ2_0.gguf"
kind = "chat"
ctx_size = 131072
port = 8088
extra_args = ["--jinja", "--reasoning", "off"]

[models."gemma-4-31b"]
# Google Gemma 4 31B-it: dense 30.7B, Google's own QAT q4_0 GGUF (17.65 GB; the 1.2 GB mmproj is
# not loaded, text only). Apache-2.0. Native 256K ctx; 60 layers, 1024-token sliding window
# interleaved 5:1 with global layers (32 heads / 16 KV heads, head_dim 256; global layers share K/V),
# so KV is small; read "KV self size" in state/gemma-4-31b.log. SWA models re-prefill about one
# ubatch per warm request through context checkpoints, as qwen3.8-27b did.
# Thinking via enable_thinking (`--reasoning off` disables it); the pin has the gemma4 parser
# (arch gemma4, upstream since April 2026).
# Why: the like-for-like rival to qwen3.8-27b (dense ~30B, same 4-bit class) with a 262,144-token
# vocabulary, so filings cost fewer tokens and more of them should fit 131K whole.
# Default ctx 131072 = the shared budget; `serve gemma-4-31b --ctx-size 262144` for the native window.
repo = "google/gemma-4-31B-it-qat-q4_0-gguf"
file = "gemma-4-31B_q4_0-it.gguf"
kind = "chat"
ctx_size = 131072
port = 8089
extra_args = ["--jinja"]
# Google's serving profile. Evals pin temperature 0 / seed 42 regardless.
sampling = { temp = 1.0, top_p = 0.95, top_k = 64 }

[models."gemma-4-31b-nothink"]
# Same weights, thinking disabled server-side (`--reasoning off` = enable_thinking=false). Same port.
repo = "google/gemma-4-31B-it-qat-q4_0-gguf"
file = "gemma-4-31B_q4_0-it.gguf"
kind = "chat"
ctx_size = 131072
port = 8089
extra_args = ["--jinja", "--reasoning", "off"]
sampling = { temp = 1.0, top_p = 0.95, top_k = 64 }

[models."gemma-4-26b-a4b"]
# Gemma 4 26B-A4B-it: MoE 25.2B total / 3.8B active, 30 layers, 128 experts, same 5:1 SWA layout
# and 262,144 vocab as the 31B. Google QAT q4_0, 14.44 GB. Same active size as gpt-oss-20b and
# glm-4.7-flash, so ~40 t/s decode is the expectation on GB10; the question is whether it reads
# 10-Ks better than they did (87.6% / 94.2%).
repo = "google/gemma-4-26B-A4B-it-qat-q4_0-gguf"
file = "gemma-4-26B_q4_0-it.gguf"
kind = "chat"
ctx_size = 131072
port = 8091
extra_args = ["--jinja"]
sampling = { temp = 1.0, top_p = 0.95, top_k = 64 }

[models."gemma-4-26b-a4b-nothink"]
# Same weights, thinking disabled server-side (--reasoning off). Same port.
repo = "google/gemma-4-26B-A4B-it-qat-q4_0-gguf"
file = "gemma-4-26B_q4_0-it.gguf"
kind = "chat"
ctx_size = 131072
port = 8091
extra_args = ["--jinja", "--reasoning", "off"]
sampling = { temp = 1.0, top_p = 0.95, top_k = 64 }

[models."deepseek-v4-flash"]
# DeepSeek-V4-Flash-0731 (MIT): MoE, 43 layers, 256 routed + 1 shared experts, 6 active/token,
# ~13B active; per-layer compressed sparse attention (compress_ratios 4x/128x, head_dim 512,
# sliding_window 128, lightning indexer index_topk 512); native 1,048,576 ctx (YaRN x16 from 64K);
# vocab 129,280; llama.cpp arch deepseek4 (June 2026) + the 0731 chat template (Aug 2026), both in
# the pin. Unsloth UD-Q2_K_XL, 3 shards in the UD-Q2_K_XL/ subfolder, 96.8 GB (the downloader
# handles them, as for qwen3.5-122b-a10b). UD-IQ3_XXS (104.2 GB) is the upgrade if memory allows;
# UD-Q4_K_XL (155 GB) does not fit. V4.1-Flash (552B) and V4-Pro do not fit at any quant.
# KV: the vendor quotes ~3.5 KB/token for V4-Flash in its own engine; read llama.cpp's "KV self
# size" from state/deepseek-v4-flash.log before raising ctx. 131072 first; the 1M window is not
# attempted next to 97 GB of weights on 128 GB. KV types left at f16 (the pin forces matching K/V
# types and FA when V is quantised, PR #25871). Spark only: over the Halo's 96 GB VGM cap and the
# 5090. Drop the page cache before the first load (see nemotron) and serve with
# LOCAL_LLM_HEALTH_TIMEOUT_S=1500 (the 300 s default is too short for a 97 GB load).
# PIN RISKS, gated by scripts/spark-new-models-smoke.sh before any full run: DeepSeek ships no
# Jinja template (verify the served template and reasoning_content separation) and the prompt
# cache delimiters fix (upstream PR #29008) landed after our pin: cached_prompt_tokens on warm
# rows must be >= 80% of the prompt or every question re-prefills the filing.
repo = "unsloth/DeepSeek-V4-Flash-0731-GGUF"
quant = "UD-Q2_K_XL"
kind = "chat"
ctx_size = 131072
n_parallel = 1          # one slot; the window is the point of this model
port = 8092
extra_args = ["--jinja"]
# No sampling line: the vendor profile (temp 1.0, top_p 0.95 agentic / 1.0 otherwise) is for
# thinking mode; model defaults apply. Evals pin temperature 0 / seed 42 regardless.

[models."deepseek-v4-flash-nothink"]
# PRIMARY row for our 4096-token completion budget: the vendor sizes thinking output at up to 384K
# tokens, so thinking on will truncate. Same port. The pinned V4 Flash 0731 template honours
# enable_thinking, so `--reasoning off` is enough; if the served GGUF template differs, use
# ["--jinja", "--chat-template-kwargs", "{\"enable_thinking\": false}"] instead.
repo = "unsloth/DeepSeek-V4-Flash-0731-GGUF"
quant = "UD-Q2_K_XL"
kind = "chat"
ctx_size = 131072
n_parallel = 1
port = 8092
extra_args = ["--jinja", "--reasoning", "off"]

[models."laguna-s-2.1"]
# Poolside Laguna S 2.1 (OpenMDW-1.1): MoE, 118B total / 8B active, GQA with interleaved full and
# sliding-window attention layers (verify exact layer/head counts against poolside/Laguna-S-2.1's
# HF page and arXiv:2605.27605 on first real run). Same active-parameter class as gpt-oss-120b
# (117B/5.1B active), so this is the first apples-to-apples MoE comparison against our best Spark
# result, not just another leaderboard entry. Also the first coding-specialist model registered on
# the Spark: Poolside built the Laguna family for agentic coding/SWE, which this project's SWE
# benchmarks (see `eval swe check` in the smoke script) have had nothing purpose-built to test
# against so far.
# Checkpoint: unsloth/Laguna-S-2.1-GGUF, quant UD-Q4_K_XL, ~40 GB across 3 shards (the downloader
# handles multi-shard GGUFs, as for deepseek-v4-flash and qwen3.5-122b-a10b). Small enough to serve
# on the Spark and Halo (96 GB VGM cap) both; too big for the RTX 5090's 32 GB.
# llama.cpp arch support (Laguna XS.2/M.1) merged upstream 2026-07-22 (PR #25165), before our pin
# (82d6bb284d1f, cut 2026-09-11) — same story as gemma4 and deepseek4, no pin bump expected.
# Vendor default is thinking OFF (opposite of every other model registered so far), so this base
# entry, not a "-nothink" twin, is the PRIMARY row. See "laguna-s-2.1-thinking" for the twin.
# Context: vendor docs disagree (262,144 documented in some places, up to 1M claimed elsewhere).
# Register at the shared 131072 budget like every other model; read "KV self size" from
# state/laguna-s-2.1.log before trying a larger window.
# Known risk: an upstream HF discussion on poolside/Laguna-S-2.1 reports repeated thinking loops;
# watch for this on the "-thinking" twin the way DeepSeek's cache-reuse risk was gated.
repo = "unsloth/Laguna-S-2.1-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8093
extra_args = ["--jinja"]

[models."laguna-s-2.1-thinking"]
# Same weights, thinking enabled server-side. Same port. Vendor's own template turns thinking on
# via `enable_thinking`; verify the served template honours this the same way the deepseek entries
# do, and fall back to ["--jinja", "--reasoning", "on"] if `--chat-template-kwargs` does not apply.
repo = "unsloth/Laguna-S-2.1-GGUF"
quant = "UD-Q4_K_XL"
kind = "chat"
ctx_size = 131072
port = 8093
extra_args = ["--jinja", "--chat-template-kwargs", "{\"enable_thinking\": true}"]
